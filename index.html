<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tacticus Damage Calculator</title>
    <meta name="description" content="Guild Raid damage calculator for Warhammer 40,000: Tacticus" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect restore
      // Check if we were redirected from 404.html and restore the original path
      (function() {
        const redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          // Only restore if we're at the base path
          if (window.location.pathname === '/TacticusDamageCalc/' || window.location.pathname === '/TacticusDamageCalc') {
            window.history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
